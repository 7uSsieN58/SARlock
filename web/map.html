<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SARlock</title>
    <link rel="icon" type="image/png" href="assets/images/logo_nobg_circular.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="audio/sound-control.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <script src="audio/audio-manager.js" defer></script>
    <script src="progress/case-progress.js" defer></script>
    <script src="map.js" defer></script>
</head>
<body id="map-page">
    <nav>
        <div class="logo">
            <img src="assets/images/logo_nobg_circular.png" alt="">
        </div>
        <div class="nav-tools">
            <div id="sound-control"></div>
            <div class="git">
            <a href="https://github.com/7uSsieN58/SARlock.git" target="_blank">
                    <i class="fa-brands fa-github"></i>
            </a>
        </div>
        </div>
    </nav>
    <main class="container" id="content-in-map-page">
        <div class="leftside">
            <ul id="case-list" class="case-list" aria-label="Available case stories"></ul>
            <model-viewer
                id="earth"
                class="viewer"
                src="models/earth-v1.glb"
                alt="A 3D model of the Earth"
                camera-controls
                auto-rotate
                touch-action="pan-y">

                <div class="hotspot" slot="hotspot-chokwe" data-case-id="case-01"
                    data-position="-0.5522201760530916m -0.309041248500574m -0.7739195982394437m" 
                    data-normal="-0.550137473012261m -0.2977314700604816m -0.780195316906804m"
                    data-info="Chókwè District, Gaza Province, Mozambique">
                    <a href="story.html?case=case-01" data-sound="case-select"></a>
                    <p class="label">Mozambique</p>
                </div>
                <div class="hotspot" slot="hotspot-russia" data-case-id="case-02"
                    data-position="-0.19610626608373827m 0.823825883597045m 0.5316048287472055m" 
                    data-normal="-0.20147444199664408m 0.8276511716682419m 0.5238335491912748m"
                    data-info="Eastern Kamchatka Highlands, Russia">
                    <a href="story.html?case=case-02" data-sound="case-select"></a>
                    <p class="label">Russia</p> 
                </div>

            </model-viewer>
        </div>
        <div class="map_side">
            <div class="char"><img id="narrator-img" src="assets/narrator/greeting_nobg.png" alt="Zack"></div>
            <div class="text">
                <p id="narrator-text" style="white-space: pre-wrap;"></p>
            </div>
        </div>
    </main>


    <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.4.0/dist/model-viewer.min.js"></script>
</body>
</html>
