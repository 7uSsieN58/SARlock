<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SARlock</title>
    <link rel="icon" type="image/png" href="assets/images/logo_nobg_circular.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <script src="map.js" defer></script>
</head>
<body id="map-page">
    <nav>
        <div class="logo">
            <img src="assets/images/logo_nobg_circular.png" alt="">
        </div>
        <div class="pages">
            <a href="index.html">Home</a>
            <a href="map.html" class="chosen">Map</a>
            <a href="">Story Mode</a>
        </div>
        <div class="git">
            <a href="https://github.com/7uSsieN58/SARlock.git" target="_blank">
                    <i class="fa-brands fa-github"></i>
            </a>
        </div>
    </nav>
    <main class="container" id="content-in-map-page">
        <div class="leftside">
            <model-viewer
                id="earth"
                class="viewer"
                src="models/earth-v1.glb"
                alt="A 3D model of the Earth"
                camera-controls
                auto-rotate
                touch-action="pan-y">

                <button class="hotspot" slot="hotspot-cairo"
                    data-position="0.449m 0.501m 0.740m"
                    data-normal="0.449m 0.501m 0.740m"
                    data-info="Cairo, Egypt">1</button>

            </model-viewer>
        </div>
        <div class="map_side">
            <div class="char"><img id="narrator-img" src="assets/narrator/greeting_nobg.png" alt="Zack"></div>
            <div class="text">
                <p id="narrator-text" style="white-space: pre-wrap;"></p>
                <a href="map.html" id="start-btn" style="display: none;">Start Mission 🚀</a>
            </div>
        </div>
    </main>


    <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.4.0/dist/model-viewer.min.js"></script>
</body>
</html>
