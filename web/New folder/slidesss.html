<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SARlock · Case</title>
  <style>
    :root{
      --bg:#0b1020; --panel:#121a33; --panel2:#18224a; --line:#2b3868; --text:#eef2ff; --muted:#9fb0d8;
      --accent:#ff6b3d; --accent2:#4dd6ff; --good:#3ddc97; --bad:#ff5d73; --radius:14px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    a{color:var(--accent2)}
    .wrap{max-width:1120px;margin:0 auto;padding:16px}
    header.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:12px}
    header.top h1{margin:0;font-size:1.35rem}
    header.top p{margin:0;color:var(--muted)}
    .back{color:var(--muted);text-decoration:none;font-size:.9rem}
    .back:hover{color:var(--text)}

    /* stepper */
    .stepper{list-style:none;display:flex;gap:6px;padding:0;margin:0 0 16px;flex-wrap:wrap}
    .stepper button{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);
      background:var(--panel);color:var(--muted);cursor:pointer;font:inherit;font-size:.88rem}
    .stepper button .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--panel2);font-weight:700;font-size:.8rem}
    .stepper button[aria-current="step"]{border-color:var(--accent);color:var(--text)}
    .stepper button[aria-current="step"] .n{background:var(--accent);color:#fff}
    .stepper button[disabled]{opacity:.45;cursor:not-allowed}
    .stepper button.done .n{background:var(--good);color:#06281a}

    .layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:18px;align-items:start}
    .stage{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px}
    .stage h2{margin:0 0 4px;font-size:1.5rem}
    .stage h2:focus{outline:none}
    .stage h3{margin:18px 0 6px;font-size:1.05rem}
    .eyebrow{color:var(--accent);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:.78rem}
    .chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
    .chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:.85rem;color:var(--muted)}
    .hook{margin:14px 0;padding:14px 16px;border-left:4px solid var(--accent);background:var(--panel2);border-radius:0 10px 10px 0;font-size:1.12rem}
    dl.facts{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:8px 0 0}
    dl.facts dt{color:var(--muted)} dl.facts dd{margin:0}
    .cite{font-size:.75rem;vertical-align:super;margin-left:3px;text-decoration:none}

    /* sar */
    aside.sar{position:sticky;top:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;text-align:center}
    .mascot{width:150px;height:150px;margin:0 auto}
    .bubble{margin-top:8px;padding:12px 14px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;text-align:left;font-size:.92rem;position:relative}
    .bubble::before{content:"";position:absolute;top:-8px;left:50%;margin-left:-8px;border:8px solid transparent;border-top:0;border-bottom-color:var(--line)}
    .sar-name{font-weight:800;letter-spacing:.08em;margin-top:4px;color:var(--accent)}

    /* mascot poses (SVG parts toggled by data-pose) */
    .mascot svg{width:100%;height:100%;overflow:visible}
    .mascot .m-mouth,.mascot .m-eyes-big,.mascot .m-arm-wave,.mascot .m-arm-point,.mascot .m-star{display:none}
    .mascot [data-pose="greeting"] .m-mouth-smile,.mascot [data-pose="greeting"] .m-arm-wave,
    .mascot [data-pose="amazed"] .m-mouth-o,.mascot [data-pose="amazed"] .m-eyes-big,
    .mascot [data-pose="curious"] .m-mouth-flat,
    .mascot [data-pose="explaining"] .m-mouth-smile,.mascot [data-pose="explaining"] .m-arm-point,
    .mascot [data-pose="proud"] .m-mouth-smile,.mascot [data-pose="proud"] .m-star{display:inline}
    .mascot [data-pose="amazed"] .m-eyes-small,.mascot [data-pose="amazed"] .m-eyes-normal{display:none}
    .mascot [data-pose="curious"] .m-head{transform:rotate(-8deg);transform-origin:100px 100px}
    .mascot [data-pose="proud"] .m-head{transform:translateY(-4px)}
    @media (prefers-reduced-motion:no-preference){
      .mascot [data-pose="greeting"] .m-arm-wave{animation:wave 1s ease-in-out infinite;transform-origin:150px 120px}
      .mascot [data-pose="amazed"] .m-head{animation:pop .5s ease-out}
      .mascot .m-star{animation:twinkle 1.4s ease-in-out infinite}
      .bubble{animation:fade .35s ease-out}
    }
    @keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-22deg)}}
    @keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
    @keyframes twinkle{0%,100%{opacity:.4}50%{opacity:1}}
    @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

    /* channel toggle */
    .toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:12px 0}
    .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
    .seg button{padding:7px 16px;border:0;background:var(--panel2);color:var(--muted);cursor:pointer;font:inherit;font-weight:700}
    .seg button[aria-checked="true"]{background:var(--accent);color:#fff}

    /* comparison */
    .cmp-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
    .card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px}
    .card h3{margin:0 0 8px}
    .frame{position:relative;width:100%;aspect-ratio:1/1;background:#000;border-radius:8px;overflow:hidden;user-select:none}
    .frame img.layer{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
    .cmp-before{clip-path:inset(0 50% 0 0)}
    .cmp-divider{position:absolute;top:0;bottom:0;left:50%;width:3px;background:#fff;box-shadow:0 0 6px rgba(0,0,0,.7);pointer-events:none}
    .cmp-knob{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;font-weight:800;box-shadow:0 2px 8px rgba(0,0,0,.6)}
    .cmp-range{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
    .frame:focus-within{outline:3px solid var(--accent2);outline-offset:2px}
    .tag{position:absolute;top:8px;padding:2px 9px;border-radius:6px;background:rgba(0,0,0,.65);font-size:.78rem;font-weight:700;pointer-events:none}
    .tag.l{left:8px} .tag.r{right:8px}
    .missing{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:12px;color:var(--bad);background:#1a0f14;font-size:.9rem}
    .pin{position:absolute;transform:translate(-50%,-50%);width:28px;height:28px;border-radius:50%;border:2px solid #fff;background:rgba(10,15,30,.85);color:#fff;font-weight:800;cursor:pointer;padding:0;box-shadow:0 0 0 3px rgba(77,214,255,.4)}
    .pin[aria-pressed="true"]{background:var(--accent2);color:#04202b}
    .pin:focus-visible{outline:3px solid #fff;outline-offset:2px}
    .legend{font-size:.88rem;color:var(--muted);margin:8px 0 0}
    .legend.note{font-style:italic}
    .hs-list{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:6px}
    .hs-list button{width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;padding:8px 10px;cursor:pointer;font:inherit;font-size:.9rem}
    .hs-list button[aria-pressed="true"]{border-color:var(--accent2)}
    .hs-detail{min-height:3.2em;margin:8px 0 0;padding:8px 10px;border-radius:8px;background:var(--panel);border:1px dashed var(--line);font-size:.9rem}
    details{margin-top:10px;color:var(--muted);font-size:.85rem}
    details code{word-break:break-all;color:var(--text)}
    .caps{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px;font-size:.88rem;color:var(--muted)}

    /* challenge */
    .opts{display:grid;gap:10px;margin:14px 0;padding:0;list-style:none}
    .opt{width:100%;text-align:left;padding:12px 16px;border-radius:10px;border:2px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer;font:inherit;font-size:1.02rem}
    .opt:hover:not([disabled]){border-color:var(--accent2)}
    .opt.wrong{border-color:var(--bad);background:#2a1620}
    .opt.right{border-color:var(--good);background:#10281f}
    .opt[disabled]{cursor:default}
    .feedback{margin:12px 0;padding:12px 14px;border-radius:10px;background:var(--panel2);border-left:4px solid var(--accent2)}
    .feedback.good{border-left-color:var(--good)} .feedback.bad{border-left-color:var(--bad)}
    .feedback:focus{outline:none}
    .hint{margin:8px 0;padding:10px 12px;border-radius:8px;background:#1a2550;font-size:.92rem}

    /* explanation / impact */
    .reveal{padding:16px;border-radius:12px;background:linear-gradient(135deg,#1d2b63,#2a1d4a);border:1px solid var(--line);margin:12px 0}
    .reveal .big{font-size:2rem;font-weight:800;color:var(--accent);margin:0}
    .metrics{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
    .metrics li{background:rgba(0,0,0,.25);border-radius:8px;padding:8px 12px}
    .metrics b{display:block;font-size:.85rem;color:var(--muted)}
    .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .badge{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--accent2);margin-bottom:6px}
    .callout{margin-top:14px;padding:12px 14px;border-radius:10px;background:#2b2412;border:1px solid #6b5a1f;color:#ffe9a8;font-size:.92rem}
    .summary{margin-top:16px;padding:16px;border-radius:12px;background:#10281f;border:1px solid #1f6b4d}
    .summary ul{margin:6px 0 0;padding-left:20px}

    /* nav */
    .nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px;flex-wrap:wrap}
    .btn{padding:10px 20px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font:inherit;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
    .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
    .btn[disabled],.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
    .btn:focus-visible,.opt:focus-visible,.stepper button:focus-visible,.hs-list button:focus-visible,.seg button:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
    .gate{color:var(--muted);font-size:.85rem}

    footer.page{margin-top:22px;padding:14px 4px;color:var(--muted);font-size:.82rem}
    footer.page ol{padding-left:20px;margin:6px 0}
    .error{padding:20px;border:1px solid var(--bad);border-radius:12px;background:#2a1620}

    @media (max-width:860px){
      .layout{grid-template-columns:1fr}
      aside.sar{position:static;order:-1;display:grid;grid-template-columns:90px 1fr;gap:12px;text-align:left;align-items:center}
      .mascot{width:90px;height:90px}
      .bubble{margin:0} .bubble::before{display:none}
      .sar-name{display:none}
      .cmp-grid,.two,.caps{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div>
        <a class="back" id="back-link" href="index.html">← Back to the globe</a>
        <h1 id="case-title">SARlock</h1>
        <p id="case-subtitle"></p>
      </div>
    </header>
    <nav aria-label="Experience progress"><ol class="stepper" id="stepper"></ol></nav>
    <main id="app" class="layout" aria-busy="true">
      <section class="stage"><p>Loading case…</p></section>
    </main>
    <footer class="page" id="page-footer"></footer>
    <noscript><p class="error">This interactive case needs JavaScript.</p></noscript>
  </div>
  <script src="slides.js"></script>
</body>
</html>
