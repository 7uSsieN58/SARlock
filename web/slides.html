<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SARlock</title>
    <link rel="icon" type="image/png" href="assets/images/logo_nobg_circular.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="audio/sound-control.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <script src="audio/audio-manager.js" defer></script>
    <script src="slides.js" defer></script>
</head>
<body id="slides-page">
    <nav>
        <div class="logo">
            <img src="assets/images/logo_nobg_circular.png" alt="">
        </div>
        <div class="nav-tools">
            <div id="sound-control"></div>
            <div class="git">
            <a href="https://github.com/7uSsieN58/SARlock.git" target="_blank">
                    <i class="fa-brands fa-github"></i>
            </a>
        </div>
        </div>
    </nav>
    <section class="story-section">

        <div class="slider-viewport" id="viewport">

            <div class="slides-track" id="track">

                <article class="slide">
                <h2>Slide 1</h2>
                <p>The Beginning</p>
                </article>

                <article class="slide">
                <h2>Slide 2</h2>
                <p>Event Overview</p>
                </article>

                <article class="slide">
                <h2>Slide 3</h2>
                <p>Before the Event</p>
                </article>

                <article class="slide">
                <h2>Slide 4</h2>
                <p>After the Event</p>
                </article>

                <article class="slide">
                <h2>Slide 5</h2>
                <p>What NISAR Observed</p>
                </article>

                <article class="slide">
                <h2>Slide 6</h2>
                <p>Scientific Explanation</p>
                </article>

                <article class="slide">
                <h2>Slide 7</h2>
                <p>Impact and Consequences</p>
                </article>

                <article class="slide">
                <h2>Slide 8</h2>
                <p>What We Learned</p>
                </article>

            </div>
        </div>

        <div class="slider-controls">
            <button id="prevBtn" data-sound="click" disabled>Previous</button>
            <span id="slideCounter">1 / 8</span>
            <button id="nextBtn" data-sound="click">Next</button>
        </div>
    </section>
</body>
</html>
